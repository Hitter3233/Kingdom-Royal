<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kingdom Clash</title>
<link rel="stylesheet" href="./css/style.css?v=6">
</head>
<body>
<div id="app">
  <div id="deckScreen">
    <h1>✝ Kingdom Deck Builder</h1>
    <p>Select exactly <b>8 cards</b>. You will have 4 in your hand at a time.</p>
    <div id="deckCount">0 / 8 selected</div>
    <div id="deckGrid"></div>
    <button id="startGame">Start Battle</button>
  </div>

  <div id="game">
    <canvas id="canvas" width="1000" height="760"></canvas>
    <div id="topbar">KINGDOM CLASH <span id="timer">3:00</span><div id="hint">Choose a card, then click a lane on your side.</div></div>
    <button id="openDeck">Deck</button>
    <div id="manaBox"><div id="manaBar"><div id="manaFill"></div></div><div id="manaText">5 / 10 BLESSING</div></div>
    <div id="cards"></div>
    <div id="message"><div id="result"></div><button id="restart">Play Again</button></div>
  </div>
</div>
<script src="js/cards.js"></script>
<script src="js/deck.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
